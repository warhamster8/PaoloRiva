# Pubblica il sito sul branch gh-pages con un push git.
# Bypassa deliberatamente l'API "Deployments" di GitHub Pages
# (actions/deploy-pages), che per questo account resta bloccata in
# deployment_in_progress finché il backend la cancella dopo ~10 minuti,
# indipendentemente dal timeout impostato nel job.
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p _site/SITES
          cp index.html CNAME robots.txt _site/
          touch _site/.nojekyll
          rsync -a \
            --exclude 'assets/mockups/' \
            --exclude 'LISTE.txt' \
            --exclude 'liste/' \
            SITES/ _site/SITES/

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
          cname: paoloriva.site
