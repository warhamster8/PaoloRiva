# Deploy Pages con timeout lungo.
# La piattaforma resta spesso in coda/in_progress oltre i 10 minuti di default.
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p _site/SITES
          cp index.html CNAME robots.txt _site/
          touch _site/.nojekyll
          rsync -a \
            --exclude 'assets/mockups/' \
            --exclude 'LISTE.txt' \
            --exclude 'liste/' \
            SITES/ _site/SITES/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # 45 minuti — il default (10) scade mentre Pages è ancora in_progress
          timeout: 2700000
