<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Richiedi anteprima | Paolo Riva</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --void: #07090a;
      --paper: #e7e2d8;
      --gold: #d4af37;
      --cyan: #00e5ff;
      --muted: #c5d0ce;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse 60% 50% at 50% 0%, rgba(26,60,64,0.4), transparent 60%),
        var(--void);
      color: var(--muted);
      font-family: Outfit, ui-sans-serif, system-ui, sans-serif;
    }
    .grain {
      position: fixed; inset: 0; pointer-events: none; z-index: 90;
      opacity: 0.045; mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/%3E%3C/svg%3E");
      background-size: 180px 180px;
    }
    .preview-banner {
      background: #122a2e;
      color: rgba(231,226,216,0.85); font-size: 0.65rem; letter-spacing: 0.06em;
      padding: 0.35rem 0.9rem;
      border-bottom: 1px solid rgba(212,175,55,0.2);
    }
    .wrap {
      width: min(640px, 94vw);
      margin: 0 auto;
      padding: 1.4rem 0 2.5rem;
    }
    .back {
      display: inline-flex; align-items: center; gap: 0.35rem;
      color: rgba(197,208,206,0.8); text-decoration: none;
      font-size: 0.75rem; letter-spacing: 0.06em; margin-bottom: 1rem;
    }
    .back:hover { color: var(--gold); }
    .panel {
      border: 1px solid rgba(212,175,55,0.2);
      background: linear-gradient(160deg, rgba(22,48,52,0.72), rgba(10,12,13,0.94));
      padding: 1.15rem 1.2rem 1.3rem;
    }
    .kicker {
      font-size: 0.55rem; letter-spacing: 0.22em; text-transform: uppercase;
      color: rgba(212,175,55,0.7);
    }
    .book-row {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 0.85rem;
      margin: 0.7rem 0 1rem;
      align-items: center;
    }
    .cover {
      width: 72px; aspect-ratio: 2/3; border-radius: 1px; overflow: hidden;
      box-shadow: 0 0 0 1px rgba(212,175,55,0.35), 4px 8px 16px rgba(0,0,0,0.45);
      background: #0d1516;
    }
    .cover img, .cover .ph {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .cover .ph {
      display: grid; place-items: center; padding: 0.35rem; text-align: center;
      background: linear-gradient(160deg, #1a3c40, #0a1012);
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 0.75rem; color: var(--paper); line-height: 1.15;
    }
    h1 {
      margin: 0;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(1.5rem, 4vw, 2rem); color: var(--paper); line-height: 1.1;
    }
    .subtitle {
      margin: 0.2rem 0 0;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-style: italic; color: rgba(231,226,216,0.75);
    }
    .hint {
      margin: 0 0 1rem;
      font-size: 0.85rem; line-height: 1.5; color: rgba(197,208,206,0.88);
    }
    form { display: grid; gap: 0.65rem; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.65rem; }
    label {
      display: grid; gap: 0.25rem; font-size: 0.65rem;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: rgba(154,168,168,0.9);
    }
    input[type="text"], input[type="email"] {
      width: 100%; appearance: none;
      background: rgba(0,0,0,0.35); border: 1px solid rgba(212,175,55,0.22);
      color: var(--paper); padding: 0.7rem 0.75rem; border-radius: 2px;
      font: 400 0.9rem Outfit, sans-serif;
    }
    input:focus {
      outline: none; border-color: rgba(212,175,55,0.5);
      box-shadow: 0 0 0 2px rgba(212,175,55,0.08);
    }
    .check {
      display: flex; gap: 0.5rem; align-items: flex-start;
      font-size: 0.78rem; letter-spacing: 0; text-transform: none;
      color: rgba(197,208,206,0.85);
    }
    .check input { margin-top: 0.15rem; }
    .btn-gold {
      appearance: none; border: 1px solid rgba(212,175,55,0.4);
      background: linear-gradient(110deg, #9a7a22 0%, #d4af37 48%, #8a7024 100%);
      color: #12100a; font: 700 0.82rem Outfit, sans-serif;
      letter-spacing: 0.03em; padding: 0.85rem 1rem; border-radius: 999px;
      cursor: pointer; width: 100%;
    }
    .btn-gold:hover { filter: brightness(1.08); }
    .btn-gold:disabled { opacity: 0.45; cursor: not-allowed; filter: none; }
    .form-note { margin: 0; font-size: 0.7rem; color: rgba(154,168,168,0.75); }
    .form-ok {
      display: none; padding: 0.65rem 0.75rem;
      border: 1px solid rgba(212,175,55,0.35); background: rgba(212,175,55,0.1);
      color: var(--gold); font-size: 0.82rem;
    }
    .form-ok.is-on { display: block; }
    .form-err {
      display: none; padding: 0.65rem 0.75rem;
      border: 1px solid rgba(255,255,255,0.15); background: rgba(0,0,0,0.3);
      color: var(--paper); font-size: 0.82rem;
    }
    .form-err.is-on { display: block; }
    @media (max-width: 520px) {
      .row2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
<main class="wrap">
    <a class="back" href="index.html">← Torna ai libri</a>

    <section class="panel">
      <div class="kicker">Copia in anteprima</div>
      <div class="book-row">
        <div class="cover" id="cover"></div>
        <div>
          <h1 id="title">Anteprima</h1>
          <p class="subtitle" id="subtitle"></p>
        </div>
      </div>
      <p class="hint" id="hint">
        Candidati per ricevere una copia in anteprima sul sito.
        In cambio, una recensione sincera su Amazon all’uscita.
      </p>

      <form id="arc-form" novalidate>
        <input type="hidden" name="libro" id="arc-libro" value="" />
        <div class="row2">
          <label>Nome<input type="text" name="nome" required autocomplete="given-name" /></label>
          <label>Cognome<input type="text" name="cognome" required autocomplete="family-name" /></label>
        </div>
        <label>Email<input type="email" name="email" required autocomplete="email" /></label>
        <label>Instagram (opz.)<input type="text" name="instagram" autocomplete="username" placeholder="@utente" /></label>
        <label class="check">
          <input type="checkbox" name="privacy" required />
          <span>Accetto la Privacy Policy per la gestione della copia in anteprima.</span>
        </label>
        <button class="btn-gold" type="submit" id="arc-submit">Richiedi l'anteprima</button>
        <p class="form-note">Se sei selezionato, ti mando link e password per la lettura sul sito.</p>
        <div class="form-ok" id="form-ok"></div>
        <div class="form-err" id="form-err"></div>
      </form>
    </section>
  </main>

  <script>
    (function () {
      var BOOKS = {
        "la-veglia": {
          id: "la-veglia",
          title: "La Veglia",
          subtitle: "La coscienza dentro il mostro",
          cover: "assets/la-veglia-cover.png",
          arcOpen: true
        },
        "wip-1": {
          id: "wip-1",
          title: "Work in progress",
          subtitle: "Available soon",
          cover: null,
          arcOpen: false
        },
        "wip-2": {
          id: "wip-2",
          title: "Work in progress",
          subtitle: "Available soon",
          cover: null,
          arcOpen: false
        }
      };

      var slug = (new URLSearchParams(location.search).get("libro") || "la-veglia").toLowerCase();
      var book = BOOKS[slug] || BOOKS["la-veglia"];

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      document.title = "Richiedi anteprima — " + book.title;
      document.getElementById("title").textContent = book.title;
      document.getElementById("subtitle").textContent = book.subtitle || "";
      document.getElementById("arc-libro").value = book.id;

      var cover = document.getElementById("cover");
      if (book.cover) {
        cover.innerHTML = '<img src="' + escapeHtml(book.cover) + '" alt="Copertina di ' + escapeHtml(book.title) + '" />';
      } else {
        cover.innerHTML = '<div class="ph">' + escapeHtml(book.title) + "</div>";
      }

      var submit = document.getElementById("arc-submit");
      var err = document.getElementById("form-err");
      if (!book.arcOpen) {
        submit.disabled = true;
        submit.textContent = "Anteprima non disponibile";
        document.getElementById("hint").textContent = "Questo titolo non ha ancora aperte le candidature anteprima.";
        err.textContent = "Torna alla homepage e scegli un libro con anteprima attiva.";
        err.classList.add("is-on");
      }

      var SHEETS_ENDPOINT = "https://script.google.com/macros/s/AKfycbxd7IzVaLR77FvjTQp3gyligToXpCIudG9z2_LdbeAWRz-dUTx__r_u0c0SKdwgG3yA5w/exec";

      document.getElementById("arc-form").addEventListener("submit", async function (e) {
        e.preventDefault();
        if (!book.arcOpen) return;
        var ok = document.getElementById("form-ok");
        var form = e.target;
        err.classList.remove("is-on");
        ok.classList.remove("is-on");
        submit.disabled = true;
        submit.textContent = "Invio in corso…";

        var fd = new FormData(form);
        var payload = {
          lista: "arc",
          libro: book.id,
          nome: String(fd.get("nome") || "").trim(),
          cognome: String(fd.get("cognome") || "").trim(),
          email: String(fd.get("email") || "").trim(),
          instagram: String(fd.get("instagram") || "").trim(),
          privacy: fd.get("privacy") ? "accepted" : "",
          note: "anteprima — " + book.title
        };

        try {
          var response = await fetch(SHEETS_ENDPOINT, {
            method: "POST",
            body: JSON.stringify(payload),
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            redirect: "follow"
          });
          var data = await response.json().catch(function () { return {}; });
          if (!response.ok || data.ok === false) {
            throw new Error((data && data.error) || "errore");
          }
          form.reset();
          document.getElementById("arc-libro").value = book.id;
          ok.textContent = "Richiesta inviata. Se sei selezionato, ti mando link e password.";
          ok.classList.add("is-on");
          submit.textContent = "Richiesta inviata";
        } catch (_) {
          err.textContent = "Qualcosa è andato storto. Riprova tra un momento.";
          err.classList.add("is-on");
          submit.disabled = false;
          submit.textContent = "Richiedi l'anteprima";
        }
      });
    })();
  </script>
</body>
</html>
