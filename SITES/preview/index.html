<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Anteprima redesign FR — Paolo Riva</title>
  <link rel="icon" type="image/png" href="../assets/favicon.png" />
  <style>
    body {
      margin: 0;
      background: #07090a;
      color: #c5d0ce;
      font-family: Outfit, ui-sans-serif, system-ui, sans-serif;
    }
    main { max-width: 980px; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
    p.kicker { letter-spacing: .28em; text-transform: uppercase; font-size: 11px; color: #d4af37; }
    h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); color: #e7e2d8; margin: .4rem 0 1rem; }
    a.live {
      display: inline-block;
      background: linear-gradient(110deg, #9a7a22, #d4af37, #8a7024);
      color: #12100a;
      text-decoration: none;
      font-weight: 700;
      padding: .85rem 1.3rem;
      border-radius: 999px;
      margin: .5rem .5rem 2rem 0;
    }
    a.ghost {
      display: inline-block;
      color: #e7e2d8;
      text-decoration: none;
      border: 1px solid rgba(212,175,55,.45);
      padding: .85rem 1.3rem;
      border-radius: 999px;
    }
    figure { margin: 0 0 2rem; }
    img {
      width: 100%;
      border-radius: 16px;
      border: 1px solid rgba(212,175,55,.2);
      display: block;
    }
    figcaption { margin-top: .6rem; font-size: .9rem; color: #9aa8a8; }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Anteprima · nuovo sigillo FR</p>
    <h1>Il sito ridisegnato, da guardare prima di pubblicarlo</h1>
    <p>paoloriva.site è ancora la versione vecchia. Queste sono le schermate della proposta.</p>
    <p>
      <a class="live" href="../index.html">Apri il sito nuovo (questa cartella)</a>
      <a class="ghost" href="https://github.com/warhamster8/PaoloRiva/pull/1">PR su GitHub</a>
    </p>
    <figure>
      <img src="shots/01-hero.png" alt="Hero con medaglione FR, due emisferi scrittura e circuito" width="1400" height="875" />
      <figcaption>Hero — medaglione, corsivo italiano, circuiti oro</figcaption>
    </figure>
    <figure>
      <img src="shots/02-libri.png" alt="Sezione I Libri con La Veglia e bio" width="1400" height="875" />
      <figcaption>I Libri + Chi sono</figcaption>
    </figure>
    <figure>
      <img src="shots/03-form.png" alt="Modulo iscrizione anteprima" width="1400" height="875" />
      <figcaption>Form candidatura anteprima</figcaption>
    </figure>
    <figure>
      <img src="shots/04-hero-mobile.png" alt="Hero su telefono" width="1400" height="875" />
      <figcaption>Mobile</figcaption>
    </figure>
    <figure>
      <img src="shots/05-lettura.png" alt="Pagina di accesso all anteprima riservata" width="1400" height="875" />
      <figcaption>Pagina lettura riservata</figcaption>
    </figure>
  </main>
</body>
</html>
